analysis_task:
  description: >
    Analyze this TikTok video content and classify it.
    Video: {video}
    Text content: {text}

    Look for ANY signs of: self-harm, suicide, depression,
    dangerous challenges, drug abuse, violence.
    Give a danger score from 0 to 100.
  expected_output: >
    A dictionary with:
    - score: danger score 0-100
    - category: Safe OR Harmful OR Suicide
    - decision: SAFE or DANGEROUS
    - reason: brief explanation max 15 words
  agent: analyst

verification_task:
  description: >
    Verify the analysis for video: {video}
    Assign priority level based on score.
    If score >= 80: CRITIQUE
    If score >= 50: ELEVE
    If score < 50: MODERE
  expected_output: >
    A dictionary with:
    - priority: CRITIQUE or ELEVE or MODERE
    - verified_decision: SAFE or DANGEROUS
    - confidence: high or medium or low
  agent: supervisor

alert_task:
  description: >
    If content is DANGEROUS, generate parent alert for: {video}
    Block the content and create child message.
  expected_output: >
    Final report with action taken and messages generated.
  agent: alerter
